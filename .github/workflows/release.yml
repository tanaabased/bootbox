name: Release

on:
  release:
    types:
      - published

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run linter
        run: bun run lint
      - name: Export release metadata
        run: |
          echo "SITEMAP_LASTMOD=${{ github.event.release.published_at }}" >> "${GITHUB_ENV}"
      - name: Publish repository
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            bun run build
            version-injector dist/bootbox.sh --style sh --version "${{ github.event.release.tag_name }}"
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
