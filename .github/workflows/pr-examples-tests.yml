name: Examples Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: ${{ matrix.example }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
        example:
          - inputs
          - defaults
          - homebrew
          - brewfiles
          - dotpkgs
          - ssh-keys
          - legacy
          - sudo
        include:
          - os: ubuntu-24.04
            example: stow
          - os: ubuntu-24.04
            example: stow-failures
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare pre-fix regression artifact
        if: matrix.example == 'stow'
        shell: bash
        run: |
          git fetch --depth=1 origin 62c646d10abac6b84835359f1b10a645f2f4fb10
          baseline="$RUNNER_TEMP/bootbox-baseline"
          mkdir -p "$baseline"
          git archive 62c646d10abac6b84835359f1b10a645f2f4fb10 | tar -x -C "$baseline"
          (cd "$baseline" && bun run build)
          echo "BOOTBOX_BASELINE=$baseline/dist/bootbox.sh" >> "$GITHUB_ENV"
      - name: Prepare release-shaped build
        uses: tanaabased/prepare-release-action@v1
        with:
          version: dev
          sync: false
          commands: |
            bun run build
            version-injector dist/bootbox.sh --style sh --version "$PREPARE_RELEASE_VERSION"
      - name: Create bootbox alias for Leia examples
        shell: bash
        run: ln -sf bootbox.sh dist/bootbox
      - name: Put prepared tools on PATH
        shell: bash
        run: |
          echo "$PWD/dist" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Refresh Homebrew metadata
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE= brew update-if-needed
      - name: Run Leia-backed example
        uses: tanaabased/actions/run-leia@v1
        env:
          BOOTBOX_OP_TESTVAULT: ${{ matrix.example == 'ssh-keys' && secrets.TANAAB_OP_TESTVAULT || '' }}
        with:
          scenarios: examples/${{ matrix.example }}/README.md
          shell: bash
          retry: 0
          stdin: true
